# Fly.io app config for StockOps
# Create the app once:  fly apps create stockops
# Create Postgres:      fly postgres create --name stockops-db
# Attach DB:            fly postgres attach stockops-db -a stockops
# Set secrets:          see instructions (fly secrets set ...)
# Deploy:               fly deploy

app = "stockops-nickgardi"
primary_region = "iad"

[build]

[env]
  NODE_ENV = "production"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  # Keep at least one machine up so Shopify webhooks/OAuth are reliable
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
